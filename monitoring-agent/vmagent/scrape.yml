global:
  scrape_interval: 60s
  scrape_timeout: 10s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels:
          instance: 'Hostkey - RU'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'go_.*|promhttp_.*|node_scrape_collector_.*'
        action: drop

  - job_name: cadvisor
    static_configs:
      - targets: ['127.0.0.1:8081']
        labels:
          instance: 'Hostkey - RU'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'container_(cpu_usage_seconds_total|memory_working_set_bytes|memory_usage_bytes|network_(receive|transmit)_bytes_total|fs_usage_bytes|last_seen)|machine_.*'
        action: keep
      - source_labels: [__name__, name]
        regex: 'container_.*;'
        action: drop

  - job_name: vmagent
    static_configs:
      - targets: ['127.0.0.1:8429']
        labels:
          instance: 'Hostkey - RU'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'vmagent_remotewrite_(pending_data_bytes|errors_total|requests_total|bytes_sent_total)|process_resident_memory_bytes'
        action: keep
