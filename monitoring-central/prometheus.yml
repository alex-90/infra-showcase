global:
  scrape_interval: 30s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ['localhost:9100']
        labels:
          instance: monitoring-host
      #- targets: ['localhost:29100']
        #labels:
          #instance: Hostkey - RU
  - job_name: cadvisor
    static_configs:
      - targets: ['localhost:8081']
        labels:
          instance: monitoring-host
      #- targets: ['localhost:28081']
        #labels:
          #instance: Hostkey - RU

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

storage:
  tsdb:
    out_of_order_time_window: 31d
