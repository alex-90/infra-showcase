route:
  receiver: telegram
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - alertname="fail2ban ban"
      receiver: telegram-fail2ban
      group_by: [alertname, ip]
      group_wait: 10s
      group_interval: 1h
      repeat_interval: 24h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/telegram_token
        chat_id: 123456789
        parse_mode: HTML
        send_resolved: true
        message: |
          {{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} <b>{{ .CommonLabels.alertname }}</b>
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ end }}

  - name: telegram-fail2ban
    telegram_configs:
      - bot_token_file: /etc/alertmanager/telegram_token
        chat_id: 123456789
        parse_mode: HTML
        send_resolved: false
        message: '🚫 <b>fail2ban</b> [{{ .CommonLabels.jail }}]: <code>{{ .CommonLabels.ip }}</code>'
